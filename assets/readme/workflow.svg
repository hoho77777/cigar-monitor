<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="wTitle wDesc">
  <title id="wTitle">CigarMonitor 工作流程</title>
  <desc id="wDesc">四步流程：粘贴商品网址、后台定时巡检、解析库存状态并核对变化、仅在缺货转有货时通过邮件、Windows 系统通知与微信三通道提醒，站点限流时自动退避。</desc>

  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12100D"/>
      <stop offset="1" stop-color="#0B0A08"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="22" fill="url(#wbg)" stroke="#2A241C" stroke-width="1"/>

  <text x="56" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7E7364" letter-spacing="3">WATCH → PARSE → DIFF → ALERT</text>

  <!-- 连接线 -->
  <g stroke="#4A3F2C" stroke-width="1.6" stroke-dasharray="7 7">
    <line x1="212" y1="156" x2="336" y2="156"/>
    <line x1="492" y1="156" x2="616" y2="156"/>
    <line x1="772" y1="156" x2="896" y2="156"/>
  </g>
  <g fill="#C8A45C" opacity="0.75">
    <path d="M336 150 l10 6 l-10 6 z"/>
    <path d="M616 150 l10 6 l-10 6 z"/>
    <path d="M896 150 l10 6 l-10 6 z"/>
  </g>

  <!-- 01 粘贴网址 -->
  <g transform="translate(150 156)">
    <circle r="49" fill="#191510" stroke="#3C3327" stroke-width="1.2"/>
    <g fill="none" stroke="#D9B26A" stroke-width="3" stroke-linecap="round" transform="translate(-19 -19)">
      <path d="M11 15 a9 9 0 0 1 13 0 l8 8 a9 9 0 0 1 -13 12 l-3 -3"/>
      <path d="M27 23 a9 9 0 0 1 -13 0 l-8 -8 a9 9 0 0 1 13 -12 l3 3"/>
    </g>
    <text x="-76" y="-58" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#6E6252">01</text>
  </g>
  <text x="150" y="246" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#F1E8D9">粘贴商品网址</text>
  <text x="150" y="278" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="18" fill="#9A8D7C">自动识别品名并做首次检查</text>

  <!-- 02 定时巡检 -->
  <g transform="translate(430 156)">
    <circle r="49" fill="#191510" stroke="#3C3327" stroke-width="1.2"/>
    <g fill="none" stroke="#D9B26A" stroke-width="3" stroke-linecap="round" transform="translate(-19 -19)">
      <circle cx="19" cy="19" r="15"/>
      <path d="M19 9 v10 l7 4"/>
    </g>
    <text x="-76" y="-58" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#6E6252">02</text>
  </g>
  <text x="430" y="246" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#F1E8D9">后台定时巡检</text>
  <text x="430" y="278" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="18" fill="#9A8D7C">默认 5 分钟，最小 30 秒</text>

  <!-- 03 解析状态 -->
  <g transform="translate(710 156)">
    <circle r="49" fill="#191510" stroke="#3C3327" stroke-width="1.2"/>
    <g transform="translate(-19 -19)">
      <circle cx="12" cy="12" r="7.5" fill="#E4573D"/>
      <circle cx="26" cy="26" r="7.5" fill="#3FD07A"/>
      <line x1="17" y1="17" x2="21" y2="21" stroke="#D9B26A" stroke-width="2"/>
    </g>
    <text x="-76" y="-58" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#6E6252">03</text>
  </g>
  <text x="710" y="246" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#F1E8D9">解析库存状态</text>
  <text x="710" y="278" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="18" fill="#9A8D7C">JSON-LD 优先，关键词兜底</text>

  <!-- 04 三通道提醒 -->
  <g transform="translate(990 156)">
    <circle r="49" fill="#191510" stroke="#3C3327" stroke-width="1.2"/>
    <g fill="none" stroke="#D9B26A" stroke-width="3" stroke-linecap="round" transform="translate(-19 -19)">
      <path d="M19 8 a12 12 0 0 1 12 12 v7 l4 6 h-32 l4 -6 v-7 a12 12 0 0 1 12 -12 z"/>
      <path d="M15 37 a4.5 4.5 0 0 0 9 0"/>
    </g>
    <text x="-76" y="-58" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#6E6252">04</text>
  </g>
  <text x="990" y="246" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#F1E8D9">三通道提醒</text>
  <text x="990" y="278" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="18" fill="#9A8D7C">邮件 · 系统通知 · 微信</text>

  <!-- 底部口径 -->
  <g id="rules">
    <line x1="56" y1="314" x2="1144" y2="314" stroke="#2A241C" stroke-width="1"/>
    <text x="56" y="348" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="18" fill="#B6A995">
      <tspan fill="#7FE0A6">●</tspan> 只在「缺货 → 有货」变化时提醒一次<tspan fill="#4A3F2C">　|　</tspan>站点 429 自动 5→10→20 分钟退避<tspan fill="#4A3F2C">　|　</tspan>邮件内直接给出人民币到手总价与单支价
    </text>
  </g>
</svg>
